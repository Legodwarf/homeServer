services:
  actual_server:
    image: ghcr.io/actualbudget/actual:latest
    container_name: actual_server
    restart: unless-stopped
    environment:
      # ==========================================
      # MANDATORY SETTINGS
      # ==========================================
      - TZ=America/Denver
      - ACTUAL_PORT=5006

      # ==========================================
      # OPTIONAL SETTINGS (Uncomment as needed)
      # ==========================================
      # --- File Upload Limits (Useful for bulk bank statement imports) ---
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20

      # --- Multi-User / OpenID Connect (OIDC) ---
      # - ACTUAL_LOGIN_METHOD=openid
      # - ACTUAL_OPENID_DISCOVERY_URL=https://auth.yourdomain.com/.well-known/openid-configuration
      # - ACTUAL_OPENID_CLIENT_ID=your_client_id
      # - ACTUAL_OPENID_CLIENT_SECRET=your_client_secret
      # - ACTUAL_OPENID_SERVER_HOSTNAME=https://ubuntu-hostname.your-tailnet.ts.net

    ports:
      # MANDATORY FOR TAILSCALE: Exposes port 5006 to the Ubuntu host & Tailscale interface.
      # TIP: Leave as "5006:5006" so both `tailscale serve` (HTTPS UI for browsers) and direct
      # Tailscale IP requests (HTTP `http://100.x.y.z:5006` for remote MCP clients) work seamlessly.
      - "5006:5006"

    volumes:
      # MANDATORY: Persistent storage for server database and budget files
      - ./actual_data:/data

    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - automation_net  # Allows n8n & local MCP containers to connect via http://actual_server:5006

  # =========================================================================
  # OPTIONAL:Dedicated Tailscale Sidecar (Alternative to Host-Level Tailscale)
  # Only uncomment if you want a dedicated `https://actual.your-tailnet.ts.net` URL
  # separate from your Ubuntu machine's hostname.
  # =========================================================================
  # tailscale-actual:
  #   image: tailscale/tailscale:latest
  #   container_name: tailscale-actual
  #   hostname: actual
  #   restart: unless-stopped
  #   environment:
  #     - TS_AUTHKEY=tskey-auth-your_key_here
  #     - TS_STATE_DIR=/var/lib/tailscale
  #     - TS_USERSPACE=false
  #   volumes:
  #     - ./tailscale_data:/var/lib/tailscale
  #     - /dev/net/tun:/dev/net/tun
  #   cap_add:
  #     - NET_ADMIN
  #     - SYS_MODULE

networks:
  automation_net:
    external: true